<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true" focusable="false">
<!-- Realistic-looking (stylized, not a copy of real currency) $100 bill and
     banded stack, used by the /audit deck.
     <use href="#mb-bill"> is 240x102; <use href="#mb-stack"> is 240x132. -->
<defs>
  <linearGradient id="mb-paper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e9efdf"/><stop offset=".55" stop-color="#d6e2c9"/><stop offset="1" stop-color="#c3d3b3"/>
  </linearGradient>
  <linearGradient id="mb-sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="mb-oval" cx=".5" cy=".42" r=".6">
    <stop offset="0" stop-color="#eef3e6"/><stop offset="1" stop-color="#c9d8bb"/>
  </radialGradient>
  <pattern id="mb-guilloche" width="14" height="10" patternUnits="userSpaceOnUse">
    <path d="M0 5 Q3.5 0 7 5 T14 5" fill="none" stroke="#5f8a5c" stroke-width=".6" opacity=".55"/>
    <path d="M0 8 Q3.5 3 7 8 T14 8" fill="none" stroke="#5f8a5c" stroke-width=".4" opacity=".35"/>
  </pattern>
  <pattern id="mb-edge" width="6" height="3" patternUnits="userSpaceOnUse">
    <rect width="6" height="3" fill="#eef2e8"/><rect y="1.8" width="6" height=".9" fill="#b9c9ad"/>
  </pattern>
  <pattern id="mb-hatch" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
    <rect width="3" height="3" fill="#c9d8bb"/><rect width="3" height="1.3" fill="#4d7049"/>
  </pattern>
  <linearGradient id="mb-strap" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#b8862e"/><stop offset=".5" stop-color="#e2b45a"/><stop offset="1" stop-color="#b8862e"/>
  </linearGradient>

  <symbol id="mb-bill" viewBox="0 0 240 102">
    <rect x=".5" y=".5" width="239" height="101" rx="3" fill="url(#mb-paper)" stroke="#9fb593"/>
    <rect x="7" y="7" width="226" height="88" rx="2" fill="url(#mb-guilloche)" stroke="#3f6b47" stroke-width="2"/>
    <rect x="11" y="11" width="218" height="80" rx="1.5" fill="none" stroke="#3f6b47" stroke-width=".7" opacity=".8"/>
    <!-- portrait oval -->
    <ellipse cx="120" cy="51" rx="29" ry="35" fill="url(#mb-oval)" stroke="#3f6b47" stroke-width="2.2"/>
    <ellipse cx="120" cy="51" rx="24.5" ry="30.5" fill="none" stroke="#3f6b47" stroke-width=".6" opacity=".7"/>
    <path d="M111 44 Q110 30 121 29 Q131 29 131 40 Q132 47 128 52 Q125 57 120 57 Q114 56 112 51 Z" fill="url(#mb-hatch)" stroke="#3f6b47" stroke-width=".8"/>
    <path d="M113 33 Q120 26 130 33 Q127 30 121 30 Q115 30 113 33 Z" fill="#3f6b47" opacity=".6"/>
    <path d="M98 82 Q100 62 114 58 L120 64 L126 58 Q140 62 142 82 Z" fill="url(#mb-hatch)" stroke="#3f6b47" stroke-width=".8"/>
    <path d="M114 58 L120 70 L126 58" fill="none" stroke="#3f6b47" stroke-width="1"/>
    <!-- seals -->
    <circle cx="60" cy="54" r="15" fill="none" stroke="#2e3a30" stroke-width="1.6" stroke-dasharray="2 1.4" opacity=".75"/>
    <circle cx="60" cy="54" r="9" fill="#2e3a30" opacity=".18"/>
    <circle cx="180" cy="54" r="15" fill="#e3ebd8" stroke="#2f7a4a" stroke-width="2" stroke-dasharray="1.6 1.2"/>
    <text x="180" y="59.5" text-anchor="middle" font-family="Georgia,serif" font-size="15" font-weight="bold" fill="#2f7a4a">$</text>
    <!-- denominations -->
    <g font-family="Georgia,'Times New Roman',serif" font-weight="bold" fill="#2f5a37">
      <text x="15" y="27" font-size="15">100</text>
      <text x="225" y="27" font-size="15" text-anchor="end">100</text>
      <text x="15" y="88" font-size="15">100</text>
      <text x="225" y="88" font-size="22" text-anchor="end">100</text>
    </g>
    <rect x="84" y="15" width="72" height="5" rx="1" fill="#3f6b47" opacity=".28"/>
    <rect x="96" y="88" width="48" height="3.5" rx="1" fill="#3f6b47" opacity=".25"/>
    <rect x=".5" y=".5" width="239" height="101" rx="3" fill="url(#mb-sheen)"/>
  </symbol>

  <symbol id="mb-stack" viewBox="0 0 240 132">
    <!-- page edges of the stack -->
    <path d="M1 98 L1 126 Q1 131 6 131 L234 131 Q239 131 239 126 L239 98 Z" fill="url(#mb-edge)" stroke="#9fb593"/>
    <rect x="1" y="124" width="238" height="7" rx="3" fill="#8fa883" opacity=".55"/>
    <use href="#mb-bill" x="0" y="0" width="240" height="102"/>
    <!-- paper strap -->
    <rect x="102" y="0" width="36" height="131" fill="url(#mb-strap)"/>
    <rect x="102" y="0" width="36" height="131" fill="none" stroke="#8a6420" stroke-width=".8" opacity=".6"/>
    <text x="120" y="56" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="bold" fill="#5a3f10" transform="rotate(-90 120 52)">$10,000</text>
  </symbol>
</defs>
</svg>
